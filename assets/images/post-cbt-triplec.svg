<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCbt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="cbtShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgCbt)" />

  <!-- Diagonal tech lines -->
  <g stroke="#6366f1" stroke-width="1.5" opacity="0.3">
    <line x1="-100" y1="100" x2="400" y2="-100" />
    <line x1="-100" y1="250" x2="600" y2="-100" />
    <line x1="-100" y1="400" x2="800" y2="-100" />
    <line x1="100" y1="550" x2="900" y2="-50" />
    <line x1="300" y1="550" x2="1000" y2="100" />
  </g>

  <!-- Central Badge / Trophy Banner -->
  <g transform="translate(220, 75)" filter="url(#cbtShadow)">
    <rect width="360" height="290" rx="20" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    
    <!-- UKM Triple-C Emblem Style -->
    <polygon points="180,30 240,65 240,135 180,170 120,135 120,65" fill="#4f46e5" stroke="#a5b4fc" stroke-width="3" />
    <text x="180" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">CBT</text>
    <text x="180" y="138" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#fde047" text-anchor="middle">2026</text>

    <!-- Text labels -->
    <text x="180" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">CREATIVE COMPUTER CLUB</text>
    <text x="180" y="235" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" text-anchor="middle">UKM Triple-C • Pelatihan CBT 2026</text>
    
    <!-- Ribbon -->
    <rect x="70" y="250" width="220" height="26" rx="13" fill="url(#badgeGrad)" />
    <text x="180" y="267" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">WEB DEVELOPMENT DIVISION</text>
  </g>
</svg>
