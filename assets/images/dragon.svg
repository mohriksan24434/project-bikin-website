<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dragonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="dragonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura / Smoke Behind Dragon -->
  <g opacity="0.4" filter="url(#dragonGlow)">
    <path d="M50 240 Q150 180 260 220 T480 200 T680 180" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M80 260 Q200 290 320 250 T540 230 T720 190" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Dragon Main Serpentine Body -->
  <path d="M 680 160 
           C 660 140, 620 120, 560 140
           C 500 160, 480 220, 430 230
           C 380 240, 360 200, 320 190
           C 270 180, 240 230, 200 240
           C 160 250, 130 230, 90 260
           C 60 280, 40 310, 20 330" 
        stroke="url(#dragonGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Belly Ridge / Inner Line -->
  <path d="M 670 170 
           C 650 155, 615 138, 565 155
           C 510 172, 490 228, 435 240
           C 385 250, 365 212, 325 202
           C 275 192, 245 240, 205 250
           C 165 260, 135 240, 95 270" 
        stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Dorsal Spine Fins (Fin Ridges along back) -->
  <path d="M580 130 L590 105 L605 135 M535 140 L545 115 L560 145 M475 180 L485 150 L500 190 M445 215 L450 185 L465 225 M395 225 L390 195 L410 230 M335 185 L330 155 L350 190 M285 185 L280 160 L298 190 M225 215 L215 185 L235 225 M175 235 L165 205 L185 245 M125 240 L115 215 L135 252 M75 265 L60 240 L85 280" 
        stroke="#38bdf8" stroke-width="3.5" fill="rgba(56, 189, 248, 0.25)" stroke-linejoin="round"/>

  <!-- Front Claws / Talons -->
  <!-- Foreleg 1 -->
  <path d="M 520 180 Q 510 240 480 270" stroke="url(#dragonGradient)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 480 270 L 460 295 M 480 270 L 475 305 M 480 270 L 495 300" stroke="#bae6fd" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Foreleg 2 -->
  <path d="M 440 210 Q 420 260 390 285" stroke="url(#dragonGradient)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 390 285 L 375 305 M 390 285 L 390 315 M 390 285 L 405 310" stroke="#bae6fd" stroke-width="4" stroke-linecap="round"/>

  <!-- Hind Claws / Talons -->
  <!-- Hindleg 1 -->
  <path d="M 230 230 Q 210 280 180 310" stroke="url(#dragonGradient)" stroke-width="11" stroke-linecap="round"/>
  <path d="M 180 310 L 160 330 M 180 310 L 175 340 M 180 310 L 195 335" stroke="#bae6fd" stroke-width="4" stroke-linecap="round"/>

  <!-- Tail Flame / Whiskers at Tail End -->
  <path d="M 20 330 C 5 345, 0 370, 10 390 C 25 375, 30 360, 45 350" fill="url(#dragonGradient)" opacity="0.8"/>
  <path d="M 30 335 C 10 360, 20 385, 35 410 C 40 380, 50 365, 60 345" fill="#38bdf8" opacity="0.6"/>

  <!-- Dragon Head (Fierce Imperial/Eastern Dragon Profile) -->
  <g transform="translate(640, 90)">
    <!-- Horns -->
    <path d="M 30 40 C 45 15, 75 -10, 110 -15 C 90 5, 80 20, 65 35" fill="url(#glowGradient)" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 45 45 C 60 30, 85 10, 115 15 C 95 30, 85 40, 70 50" fill="url(#glowGradient)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Snout & Upper Jaw -->
    <path d="M 10 70 C 25 60, 50 50, 75 55 C 95 60, 110 70, 125 75 C 135 77, 130 90, 115 92 L 80 92 C 60 92, 50 98, 40 100" 
          fill="#0c1e3d" stroke="url(#dragonGradient)" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Lower Jaw -->
    <path d="M 35 105 C 50 102, 70 100, 90 102 C 100 103, 105 112, 95 115 C 75 120, 55 125, 30 115 Z" 
          fill="#0c1e3d" stroke="url(#dragonGradient)" stroke-width="4"/>

    <!-- Sharp Teeth -->
    <polygon points="75,92 82,99 87,92" fill="#ffffff"/>
    <polygon points="90,92 97,100 103,92" fill="#ffffff"/>
    <polygon points="105,92 110,101 116,92" fill="#ffffff"/>
    <polygon points="85,102 90,96 95,102" fill="#ffffff"/>

    <!-- Glowing Dragon Eye -->
    <ellipse cx="65" cy="65" rx="7" ry="5" fill="#38bdf8" filter="url(#dragonGlow)"/>
    <ellipse cx="65" cy="65" rx="5" ry="3" fill="#ffffff"/>
    <line x1="65" y1="60" x2="65" y2="70" stroke="#0c1e3d" stroke-width="2"/>

    <!-- Whiskers / Beard Tendrils -->
    <path d="M 115 85 C 140 80, 165 95, 180 120 C 160 115, 140 105, 120 100" 
          stroke="#7dd3fc" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 100 90 C 120 100, 145 120, 155 150 C 140 135, 125 115, 105 108" 
          stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 35 115 C 25 135, 15 160, 5 180 C 15 155, 25 135, 35 120" 
          stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Mane Flame / Head Crest -->
    <path d="M 15 50 C -10 30, -30 20, -50 25 C -30 40, -20 50, -5 65 Z" fill="#38bdf8" opacity="0.75"/>
    <path d="M 5 65 C -20 55, -45 55, -65 70 C -40 75, -25 80, -5 85 Z" fill="#2563eb" opacity="0.6"/>
  </g>
</svg>
