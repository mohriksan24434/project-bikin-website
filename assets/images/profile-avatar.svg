<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarGrad)" />
  <circle cx="200" cy="200" r="184" fill="#f8fafc" />
  
  <!-- Tech Pattern Background Elements -->
  <circle cx="90" cy="110" r="28" fill="#e0f2fe" opacity="0.7" />
  <circle cx="310" cy="120" r="22" fill="#dbeafe" opacity="0.8" />
  <path d="M70,180 L100,180 M85,165 L85,195" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M310,210 L330,210 M320,200 L320,220" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  
  <!-- Silhouette / Character Representation -->
  <g id="person" filter="url(#shadow)">
    <!-- Body / Jacket -->
    <path d="M85,385 C85,290 140,260 200,260 C260,260 315,290 315,385 Z" fill="url(#shirtGrad)" />
    
    <!-- Inner Shirt -->
    <path d="M170,260 L200,310 L230,260 Z" fill="#ffffff" />
    <!-- Tie / Accent -->
    <path d="M194,300 L206,300 L203,365 L197,365 Z" fill="#38bdf8" />
    
    <!-- Neck -->
    <rect x="178" y="210" width="44" height="60" rx="8" fill="#fed7aa" />
    
    <!-- Head -->
    <ellipse cx="200" cy="165" rx="62" ry="72" fill="#fed7aa" />
    
    <!-- Hair Modern Cut -->
    <path d="M138,155 C132,105 165,80 200,80 C235,80 268,105 262,155 C256,130 236,110 200,110 C164,110 144,130 138,155 Z" fill="#0f172a" />
    <path d="M140,150 C135,120 150,95 185,85 C225,75 265,95 265,130 C252,112 230,102 195,105 C162,108 148,130 140,150 Z" fill="#1e293b" />
    
    <!-- Stylish Glasses -->
    <rect x="152" y="148" width="38" height="28" rx="7" fill="rgba(255,255,255,0.4)" stroke="#0f172a" stroke-width="4" />
    <rect x="210" y="148" width="38" height="28" rx="7" fill="rgba(255,255,255,0.4)" stroke="#0f172a" stroke-width="4" />
    <line x1="190" y1="160" x2="210" y2="160" stroke="#0f172a" stroke-width="4" />
    <line x1="138" y1="158" x2="152" y2="160" stroke="#0f172a" stroke-width="3" />
    <line x1="248" y1="160" x2="262" y2="158" stroke="#0f172a" stroke-width="3" />

    <!-- Eyes -->
    <circle cx="171" cy="162" r="4.5" fill="#0f172a" />
    <circle cx="229" cy="162" r="4.5" fill="#0f172a" />
    <circle cx="173" cy="160" r="1.5" fill="#ffffff" />
    <circle cx="231" cy="160" r="1.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M154,139 Q171,133 188,139" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
    <path d="M212,139 Q229,133 246,139" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />

    <!-- Friendly Smile -->
    <path d="M182,204 Q200,222 218,204" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Student Developer Badge -->
  <g filter="url(#shadow)">
    <circle cx="305" cy="305" r="40" fill="#2563eb" stroke="#ffffff" stroke-width="4" />
    <text x="305" y="312" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">&lt;UTM/&gt;</text>
  </g>
</svg>
