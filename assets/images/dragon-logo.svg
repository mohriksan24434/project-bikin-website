<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoDragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Coiling Circular Dragon Body surrounding the center box (box is roughly 25-75 in coordinates) -->
  <path d="M 82 24 
           C 95 38, 96 66, 85 80
           C 74 94, 45 98, 28 92
           C 12 85, 4 66, 8 48
           C 12 32, 26 14, 48 10
           C 62 8, 76 14, 82 24" 
        stroke="url(#logoDragonGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>

  <!-- Dragon Scales / Inner Highlight Ring -->
  <path d="M 80 28 
           C 91 40, 91 63, 81 76
           C 71 88, 47 92, 32 87
           C 18 80, 11 65, 14 50
           C 17 37, 29 20, 48 16" 
        stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Spines / Fin Ridges on Outer Coil -->
  <path d="M 88 40 L 96 38 L 91 47" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.4)"/>
  <path d="M 91 58 L 98 60 L 89 66" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.4)"/>
  <path d="M 78 86 L 82 94 L 72 90" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.4)"/>
  <path d="M 52 95 L 48 101 L 43 94" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.4)"/>
  <path d="M 22 90 L 14 94 L 18 84" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.4)"/>
  <path d="M 6 56 L 0 54 L 6 47" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.4)"/>
  <path d="M 14 26 L 8 20 L 19 21" stroke="#38bdf8" stroke-width="1.5" fill="rgba(56, 189, 248, 0.4)"/>

  <!-- Claws / Talons Gripping Center Box -->
  <!-- Left Claw -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
    <path d="M 12 48 L 22 45"/>
    <path d="M 13 54 L 23 53"/>
    <path d="M 15 60 L 22 59"/>
  </g>
  
  <!-- Bottom Right Claw -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
    <path d="M 82 72 L 74 65"/>
    <path d="M 85 78 L 76 72"/>
    <path d="M 80 84 L 75 77"/>
  </g>

  <!-- Dragon Head at Top-Right embracing over the badge -->
  <g transform="translate(56, 4)">
    <!-- Horns -->
    <path d="M 18 14 C 24 6, 34 0, 42 2 C 34 8, 30 14, 25 20" fill="url(#logoDragonGrad)" stroke="#7dd3fc" stroke-width="1.5"/>
    <path d="M 14 16 C 18 8, 28 4, 35 7" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Head / Snout -->
    <path d="M 8 22 C 14 18, 24 16, 30 20 C 34 22, 33 28, 27 29 L 16 30 C 12 30, 10 32, 6 34" 
          fill="#0c1833" stroke="url(#logoDragonGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Jaw -->
    <path d="M 8 33 C 14 32, 22 31, 26 34 C 20 37, 12 38, 7 36 Z" 
          fill="#0c1833" stroke="url(#logoDragonGrad)" stroke-width="2"/>

    <!-- Glowing Eye -->
    <circle cx="21" cy="22" r="2.5" fill="#38bdf8" filter="url(#logoGlow)"/>
    <circle cx="21" cy="22" r="1.2" fill="#ffffff"/>

    <!-- Whiskers -->
    <path d="M 28 27 C 36 26, 42 32, 44 40" stroke="#7dd3fc" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 25 30 C 30 35, 34 44, 32 50" stroke="#38bdf8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
